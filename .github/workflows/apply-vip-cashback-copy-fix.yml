name: Apply VIP Cashback copy compatibility fix

on:
  push:
    branches:
      - feat/vip-cashback-redemption-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vip-cashback-redemption-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply targeted copy fix
        run: node scripts/apply-vip-cashback-copy-fix.mjs
      - name: Commit copy fix
        shell: bash
        run: |
          if git diff --quiet -- src/pages/CheckoutPage.jsx scripts/v0.11.0-vip-cashback-redemption-v1-regression-test.mjs; then
            echo 'Copy already compatible.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CheckoutPage.jsx scripts/v0.11.0-vip-cashback-redemption-v1-regression-test.mjs
          git commit -m 'Avoid card-field regression false positive in VIP copy'
          git push origin HEAD:feat/vip-cashback-redemption-v1
